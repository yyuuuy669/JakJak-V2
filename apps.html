<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>window.ITEMS = [{"name":"WhatsApp Web","url":"https://web.whatsapp.com/"},{"name":"Discord","url":"https://discord.com/app"},{"name":"YouTube","url":"https://www.youtube.com/"},{"name":"ChatGPT","url":"https://chatgpt.com/"},{"name":"Google Drive","url":"https://drive.google.com/"}];</script>
    <script src="app.js"></script>
</head>
<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="page">
        <header>
            <a class="brand" href="index.html"><img src="favicon.ico" alt=""><span>supernova</span></a>
            <nav class="nav">
                <a href="index.html">games</a>
                <a href="apps.html" class="active">apps</a>
            </nav>
            <div class="spacer"></div>
            <div class="stat" data-stat="clock" title="local time"><span></span></div>
            <div class="stat" data-stat="ping" title="ping"><span>…</span></div>
            <div class="stat" data-stat="battery" hidden><span></span></div>
            <div class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="search" placeholder="search apps" autocomplete="off">
            </div>
            <div class="theme-picker">
                <button id="theme-trigger" class="theme-trigger" type="button" aria-label="Choose theme" aria-expanded="false"><span></span></button>
                <div id="theme-menu" class="theme-menu" role="radiogroup" hidden></div>
            </div>
        </header>
        <main>
            <div class="hero">
                <img class="hero-logo" src="favicon.ico" alt="">
                <h1><span class="wrap">supernova<span class="cursor">_</span></span></h1>
                <p class="pill"><kbd>ctrl</kbd>+<kbd>D</kbd> to bookmark</p>
            </div>
            <div id="grid" class="grid"></div>
            <p id="empty" class="empty" hidden>nothing matches that search</p>
        </main>
    </div>
    <div id="toast"></div>
    <footer>&copy; supernova</footer>
</body>
</html>
